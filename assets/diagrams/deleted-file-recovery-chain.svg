<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img"><title>Deleted file recovery chain</title><rect width="960" height="600" rx="14" fill="#0d1117"/><text x="36" y="52" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#e6edf3">Deleted File Recovery with The Sleuth Kit</text><text x="36" y="80" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">From an NTFS image to a verified, byte-identical copy of the deleted JPEG</text><rect x="36" y="104" width="432" height="170" rx="10" fill="#161b22" stroke="#30363d"/><rect x="36" y="104" width="5" height="170" rx="2" fill="#58a6ff"/><text x="58" y="132" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#58a6ff">1 · EVIDENCE IMAGE</text><text x="58" y="161" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="700" fill="#e6edf3">carve1.img</text><text x="58" y="192" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">NTFS · 50 MB · 4,096-byte clusters</text><text x="58" y="216" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">MFT starts at cluster 4</text><text x="58" y="240" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">Deleted: deleted-evidence.jpg</text><rect x="492" y="104" width="432" height="170" rx="10" fill="#161b22" stroke="#30363d"/><rect x="492" y="104" width="5" height="170" rx="2" fill="#d29922"/><text x="514" y="132" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#d29922">2 · IDENTIFY (FLS -D)</text><text x="514" y="161" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="700" fill="#e6edf3">-/r * 64-128-2</text><text x="514" y="192" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">MFT entry 64 · $DATA attr 128-2</text><text x="514" y="216" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">Entry unallocated, record intact</text><text x="514" y="240" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">fls -d lists only deleted entries</text><rect x="36" y="298" width="432" height="170" rx="10" fill="#161b22" stroke="#30363d"/><rect x="36" y="298" width="5" height="170" rx="2" fill="#bc8cff"/><text x="58" y="326" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#bc8cff">3 · RECOVER (ICAT)</text><text x="58" y="355" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="700" fill="#e6edf3">icat carve1.img 64-128-2</text><text x="58" y="386" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#e6edf3">→ recovered-evidence.jpg (136K)</text><text x="58" y="410" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">JPEG, Exif, 960×643</text><text x="58" y="434" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">EXIF readable: SONY DSC</text><rect x="492" y="298" width="432" height="170" rx="10" fill="#161b22" stroke="#30363d"/><rect x="492" y="298" width="5" height="170" rx="2" fill="#3fb950"/><text x="514" y="326" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#3fb950">4 · VERIFY</text><text x="514" y="355" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="700" fill="#e6edf3">Identical to original</text><text x="514" y="386" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#e6edf3">MD5    6a460220…cb0ff4  ✓</text><text x="514" y="410" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#e6edf3">SHA256 f3dc9042…bd70775 ✓</text><text x="514" y="434" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#e6edf3">cmp -s → byte-for-byte MATCH</text><line x1="468" y1="189" x2="488" y2="189" stroke="#8b949e" stroke-width="2"/><polygon points="488,189 479.4,194.2 479.4,183.8" fill="#8b949e"/><line x1="468" y1="383" x2="488" y2="383" stroke="#8b949e" stroke-width="2"/><polygon points="488,383 479.4,388.2 479.4,377.8" fill="#8b949e"/><polyline points="708,274 708,286 252,286 252,290" fill="none" stroke="#8b949e" stroke-width="2"/><line x1="252" y1="286" x2="252" y2="294" stroke="#8b949e" stroke-width="2"/><polygon points="252,294 246.8,285.4 257.2,285.4" fill="#8b949e"/><rect x="36" y="492" width="888" height="80" rx="10" fill="#161b22" stroke="#d29922"/><text x="58" y="524" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#d29922">METADATA FINDING</text><text x="58" y="552" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#e6edf3">picture.jpg reports Canon EOS 80D, but its ExifTool backup <tspan font-family="Consolas, 'Courier New', monospace">picture.jpg_original</tspan> has no camera tags</text></svg>